name: test
on:
  push:
    branches:
    - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
        env:
          GO_ENS_TEST_RPC: ${{ secrets.GO_ENS_TEST_RPC }}
